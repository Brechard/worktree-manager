name: Release

# Cutting a release is `git tag v0.1.0 && git push --tags`. This builds the
# desktop app on each host OS (electron-builder cannot cross-compile a macOS
# .dmg from Linux) and attaches every installer to a single GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple Silicon)
            artifact: macos
          - os: windows-latest
            name: Windows
            artifact: windows
          - os: ubuntu-latest
            name: Linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo builds contracts -> shared -> desktop in dependency order.
      # electron-builder alone would package against unbuilt workspace deps.
      - name: Build
        run: bun run build

      - name: Package
        working-directory: apps/desktop
        # The app is unsigned and unnotarized: skip electron-builder's signing
        # step rather than letting it fail on a missing identity.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
