name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (for example v0.2.0); must already be tagged for full releases'
        required: true
      platform:
        description: 'Full signed release or Windows-only CI preview'
        type: choice
        options:
          - full
          - windows
        default: full

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.select-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.platform == 'windows' && github.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ inputs.platform || 'full' }}
        shell: bash
        run: |
          node scripts/release-assets.mjs check-tag "$RELEASE_TAG"
          if [[ "$RELEASE_PLATFORM" == full ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi

      - name: Select build targets
        id: select-targets
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'full' }}
        run: |
          if [[ "$RELEASE_PLATFORM" == windows ]]; then
            echo 'targets={"include":[{"runner":"windows-2025","os":"windows","platform":"win","arch":"x64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'targets={"include":[{"runner":"macos-15","os":"macos","platform":"mac","arch":"arm64"},{"runner":"macos-15-intel","os":"macos","platform":"mac","arch":"x64"},{"runner":"windows-2025","os":"windows","platform":"win","arch":"x64"},{"runner":"ubuntu-24.04","os":"linux","platform":"linux","arch":"x64"}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run test

      - name: React Doctor
        run: bun run doctor

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.platform == 'windows' && github.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: node scripts/release-assets.mjs check-tag "$RELEASE_TAG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Require macOS signing and notarization credentials
        if: matrix.os == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo 'Missing MAC_CSC_LINK or MAC_CSC_KEY_PASSWORD (Developer ID Application certificate).' >&2
            exit 1
          fi
          if [[ -n "$APPLE_API_KEY" || -n "$APPLE_API_KEY_ID" || -n "$APPLE_API_ISSUER" ]]; then
            if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
              echo 'Incomplete Apple notarization API key credentials.' >&2
              exit 1
            fi
          fi
          if [[ -n "$APPLE_ID" || -n "$APPLE_APP_SPECIFIC_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
              echo 'Incomplete Apple ID notarization credentials.' >&2
              exit 1
            fi
          fi
          if [[ -z "$APPLE_API_KEY" && -z "$APPLE_ID" ]]; then
            echo 'Missing complete Apple notarization credentials (API key or Apple ID).' >&2
            exit 1
          fi

      - name: Prepare notarization API key
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -n "$APPLE_API_KEY_BASE64" ]]; then
            umask 077
            key_path="$RUNNER_TEMP/worktree-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
            openssl pkey -in "$key_path" -noout
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ matrix.os == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.os == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: bunx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify macOS Developer ID signature and notarization
        if: matrix.os == 'macos'
        shell: bash
        run: |
          app_path="$(find apps/desktop/release -maxdepth 3 -name 'Worktree Manager.app' -type d -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'Missing packaged macOS application.' >&2
            exit 1
          fi
          expected_arch='${{ matrix.arch }}'
          if [[ "$expected_arch" == x64 ]]; then expected_arch=x86_64; fi
          test "$(lipo -archs "$app_path/Contents/MacOS/Worktree Manager")" = "$expected_arch"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_authority="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signing_authority" != *'Authority=Developer ID Application:'* ]]; then
            echo 'Application is not signed by a Developer ID Application identity.' >&2
            exit 1
          fi
          xcrun stapler validate "$app_path"
          spctl --assess --verbose --type exec "$app_path"

      - name: Smoke packaged macOS application
        if: matrix.os == 'macos'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          executable="$(find apps/desktop/release -maxdepth 5 -type f -path '*/Contents/MacOS/Worktree Manager' -print -quit)"
          test -n "$executable"
          node scripts/smoke-packaged.mjs "$executable" --screenshot "$HOME/dev/tests/worktree-manager/$RELEASE_TAG/01-packaged-${{ matrix.os }}-${{ matrix.arch }}.png"

      - name: Smoke packaged Windows application
        if: matrix.os == 'windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          executable="$(find apps/desktop/release/win-unpacked -maxdepth 1 -type f -name 'Worktree Manager.exe' -print -quit)"
          test -n "$executable"
          node scripts/smoke-packaged.mjs "$executable" --screenshot "$HOME/dev/tests/worktree-manager/$RELEASE_TAG/01-packaged-${{ matrix.os }}-${{ matrix.arch }}.png"

      - name: Smoke packaged Linux application
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          executable="$(find apps/desktop/release/linux-unpacked -maxdepth 1 -type f \( -name 'worktree-manager' -o -name 'Worktree Manager' \) -print -quit)"
          test -n "$executable"
          xvfb-run -a node scripts/smoke-packaged.mjs "$executable" --no-sandbox --screenshot "$HOME/dev/tests/worktree-manager/$RELEASE_TAG/01-packaged-${{ matrix.os }}-${{ matrix.arch }}.png"

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: ~/dev/tests/worktree-manager/${{ github.event.inputs.tag || github.ref_name }}/01-packaged-${{ matrix.os }}-${{ matrix.arch }}.png
          if-no-files-found: error
          retention-days: 14

      - name: Stage and validate release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-assets.mjs stage "$RELEASE_TAG" '${{ matrix.os }}' '${{ matrix.arch }}' apps/desktop/release release-stage

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release-stage/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Stage draft GitHub release
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-builds

      - name: Assemble and checksum exact release set
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-assets.mjs assemble "$RELEASE_TAG" release-builds release-assets

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to change it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          expected_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected_assets" != "$actual_assets" ]]; then
            echo 'Draft release assets do not match the validated build set.' >&2
            exit 1
          fi
